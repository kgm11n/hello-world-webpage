<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings from Saturn</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f4d03f 0%, #d4af37 50%, #c9a961 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #d4af37;
            margin: 0;
            font-size: 3em;
        }
        
        p {
            color: #666;
            margin-top: 10px;
            font-size: 1.2em;
        }
        
        .planet {
            font-size: 4em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="planet">🪐</div>
        <h1>Greetings from Saturn!</h1>
        <p>Welcome to the Lord of the Rings</p>
    </div>
</body>
</html>
