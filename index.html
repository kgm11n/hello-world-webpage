<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings from Jupiter</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff9f43 0%, #ee5a6f 50%, #c44569 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #ff6b35;
            margin: 0;
            font-size: 3em;
        }
        
        p {
            color: #666;
            margin-top: 10px;
            font-size: 1.2em;
        }
        
        .planet {
            font-size: 4em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="planet">🪐</div>
        <h1>Greetings from Jupiter!</h1>
        <p>Welcome to the Great Red Spot of the Solar System</p>
    </div>
</body>
</html>
